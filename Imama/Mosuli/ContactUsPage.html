<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Imama Nutrition Community & Skill Development Centre</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel="stylesheet">
    <link rel="stylesheet" href="styles1.css">
</head>
<body>
    <header>
        <div class="content">            
            <div class="logo">
                <img src="logo.jpg" alt="logo">
            </div>

            <nav>
                <ul class="navbar">
                    <li><a href="index.html"><i class='bx bx-home-heart'></i> Home</a></li>
                    <li><a href="about.html"><i class='bx bx-user'></i>About Us</a></li>
                    <li><a href="sponsors.html"><i class='bx bxs-group'></i>Sponsors</a></li>
                    <li><a href="donations.html"><i class='bx bxs-donate-heart'></i>Donations</a></li>
                    <li><a href="events.html"><i class='bx bxs-calendar-event'></i></i>Events</a></li>
                    <li><a href="volunteer.html"><i class='bx bxs-hand'></i>Volunteer</a></li>
                    <li><a class="active" href="ContactUsPage.html"><i class='bx bxs-contact'></i>Contact Us</a></li>
                </ul>
            </nav>
    </header>

  

    <main class="contact-container">
        <h1>Contact Us</h1>
        <p>We’d love to hear from you! Please fill out the form below or contact us directly.</p>

        <form action="#" method="POST" class="contact-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Your Message..." rows="6" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Imama Nutrition Community & Skill Development Centre. All Rights Reserved.</p>
    </footer>
</body>
</html>
